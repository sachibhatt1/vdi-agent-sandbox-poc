apiVersion: agents.k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: sandbox-durable
spec:
  operatingMode: Running
  template:
    metadata:
      labels:
        sandbox: sandbox-durable
    spec:
      containers:
        - name: agent
          image: local/agent-durable:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-durable-workspace
